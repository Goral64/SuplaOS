<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuplaOS</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --card: #fff; --text: #1d2329; --muted: #5f6b76; --accent: #00a651; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181c; --card: #1e2429; --text: #e6eaed; --muted: #9aa5ae; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { background: var(--card); max-width: 32rem; margin: 16px; padding: 2rem; border-radius: 12px;
         box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
  h1 span { color: var(--accent); }
  .version { color: var(--muted); margin: 0 0 1.5rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 1.5rem 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Supla<span>OS</span></h1>
  <p class="version">@VERSION@</p>
  <p data-en="The management panel is not ready yet. For now the system is available over SSH."
     data-pl="Panel zarządzania jeszcze nie jest gotowy. Na razie system jest dostępny przez SSH."></p>
  <dl>
    <dt>SSH</dt><dd id="ssh"></dd>
    <dt data-en="Host name" data-pl="Nazwa hosta"></dt><dd>@HOSTNAME@.local</dd>
  </dl>
</main>
<script>
  var lang = (navigator.language || "en").slice(0, 2) === "pl" ? "pl" : "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset[lang]; });
  document.getElementById("ssh").textContent = "ssh supla@" + location.hostname;
</script>
</body>
</html>
