name: Images

# Builds the images on a version tag (v*) or by hand. Tagged builds go to a
# release (marked as a pre-release), manual ones are kept as workflow
# artifacts for a week.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-24.04
          - target: rpi
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build
        # The privileged container way, as without KVM at home.
        env:
          SUPLAOS_NO_KVM: "1"
        run: tools/build.sh ${{ matrix.target }} "$VERSION"
      - name: Checksum
        run: cd out && sha256sum *.img.xz > "suplaos-$VERSION-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: |
            out/*.img.xz
            out/*.sha256
          retention-days: 7
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "SuplaOS ${GITHUB_REF_NAME#v}" --generate-notes
