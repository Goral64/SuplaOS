name: Images

# Builds the images and the suplaos packages on a version tag (v*) or by
# hand. Tagged builds go to a release (marked as a pre-release) and the
# packages to the apt repository on GitHub Pages; manual ones are kept as
# workflow artifacts for a week.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-24.04
          - target: rpi
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build
        # The privileged container way, as without KVM at home.
        env:
          SUPLAOS_NO_KVM: "1"
        run: tools/build.sh ${{ matrix.target }} "$VERSION"
      - name: Checksum
        run: cd out && sha256sum *.img.xz > "suplaos-$VERSION-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: |
            out/*.img.xz
            out/*.sha256
            out/*.deb
          retention-days: 7
          compression-level: 0

  apt:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          tools/apt-repo.sh site/apt out/*.deb
          cp package/usr/share/keyrings/suplaos-archive-keyring.pgp site/apt/
          cd site
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Packages for $GITHUB_REF_NAME"
          git push -q origin gh-pages

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the section of this version in CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          if grep -q . notes.md; then
            printf '\n[Po polsku](https://github.com/%s/blob/main/docs/pl/CHANGELOG.md#%s)\n' \
              "$GITHUB_REPOSITORY" "${version//./}" >> notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "SuplaOS $version" "${notes[@]}"
