name: supla-docker

# Once a day: the newest release of supla-docker is tried with SuplaOS on
# amd64 and arm64, a new install and an update. Devices follow the releases
# themselves, so this changes nothing: a failure opens an issue.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Newest release of supla-docker
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/SUPLA/supla-docker/releases/latest -q .tag_name)" >> "$GITHUB_OUTPUT"

  test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: SuplaOS 0.12.2, to update from
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download v0.12.2 --repo "$GITHUB_REPOSITORY"
          --pattern "suplaos_0.12.2_${{ matrix.arch }}.deb" --output "$RUNNER_TEMP/before.deb"
      - name: New install and update
        run: |
          mkdir -p out
          tools/go.sh build -o out/suplaos ./cmd/suplaos
          tools/supla-release-test.sh out/suplaos addons "$RUNNER_TEMP/before.deb"

  report:
    needs: [release, test]
    if: failure() && needs.release.outputs.tag
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure
        run: |
          title="supla-docker $TAG: the test with SuplaOS failed"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" -q '.[0].number' --json number)" ]; then
            gh issue create --title "$title" --body "The test with supla-docker $TAG failed: $RUN"
          fi
