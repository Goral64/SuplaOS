services:
  zigbee2mqtt:
    container_name: ${COMPOSE_PROJECT_NAME}-zigbee2mqtt
    image: ${ZIGBEE2MQTT_IMAGE:-ghcr.io/koenkk/zigbee2mqtt:latest}
    restart: unless-stopped
    depends_on:
      - mosquitto
    # The web interface (first start setup, pairing, device list) is served
    # by the SuplaOS panel on ZIGBEE2MQTT_PORT, over HTTPS and after
    # logging in; no port is published.
    volumes:
      # Network key and paired devices. Back it up!
      - ${VOLUME_DATA}/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    environment:
      TZ: ${TZ}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      # Login to the mosquitto add-on.
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MOSQUITTO_USERNAME}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MOSQUITTO_PASSWORD}
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
      # zigbee2supla shows devices unavailable in ZigBee as offline in Supla.
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
    logging:
      driver: "json-file"
      options:
        max-size: 50m
