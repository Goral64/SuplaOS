id: zigbee2mqtt
name: Zigbee2MQTT
description:
  en: ZigBee coordinator (USB or network) and device pairing
  pl: Koordynator ZigBee (USB albo sieciowy) i parowanie urządzeń
requires: [mosquitto]
recommends: [zigbee2supla]
compose:
  - docker-compose.zigbee2mqtt.yml
  - file: docker-compose.zigbee2mqtt-usb.yml
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: usb}
  # Before the network file: its adapter type wins over one left from USB.
  - file: docker-compose.zigbee2mqtt-usb-adapter.yml
    when: {option: ZIGBEE2MQTT_USB_ADAPTER, in: [zstack, ember, deconz, zigate, zboss]}
  - file: docker-compose.zigbee2mqtt-network.yml
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: network}
services: [zigbee2mqtt]
images:
  zigbee2mqtt:
    changelog: https://github.com/Koenkk/zigbee2mqtt/releases
dirs: [var/zigbee2mqtt]
data: [var/zigbee2mqtt]
# Its files change while it runs: stopped for a full backup.
full_backup:
  skip: [var/zigbee2mqtt/log]
  stop: true

options:
  - key: ZIGBEE2MQTT_COORDINATOR
    label: {en: Coordinator, pl: Koordynator}
    type: select
    choices: [usb, network]
    default: usb
    required: true
  - key: ZIGBEE_ADAPTER
    label: {en: USB device, pl: Urządzenie USB}
    help:
      en: Preferably /dev/serial/by-id/..., the name does not change between restarts.
      pl: Najlepiej /dev/serial/by-id/..., ta nazwa nie zmienia się po restarcie.
    type: serial
    required: true
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: usb}
  - key: ZIGBEE2MQTT_USB_ADAPTER
    label: {en: Coordinator type, pl: Typ koordynatora}
    help:
      en: zstack - TI CC2652/CC1352 (e.g. Sonoff ZBDongle-P), ember - Silicon Labs (e.g. Sonoff ZBDongle-E), deconz - ConBee, RaspBee
      pl: zstack - TI CC2652/CC1352 (np. Sonoff ZBDongle-P), ember - Silicon Labs (np. Sonoff ZBDongle-E), deconz - ConBee, RaspBee
    type: select
    choices: [zstack, ember, deconz, zigate, zboss, keep]
    choice_labels:
      keep: {en: As set in Zigbee2MQTT, pl: Jak ustawiono w Zigbee2MQTT}
    default: zstack
    # Installs from before the option chose the type on the first start
    # page of Zigbee2MQTT: it stays.
    upgrade_default: keep
    required: true
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: usb}
  - key: ZIGBEE2MQTT_SERIAL_PORT
    label: {en: Coordinator address, pl: Adres koordynatora}
    help:
      en: e.g. tcp://192.168.1.50:6638
      pl: np. tcp://192.168.1.50:6638
    required: true
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: network}
  - key: ZIGBEE2MQTT_SERIAL_ADAPTER
    label: {en: Coordinator type, pl: Typ koordynatora}
    help:
      en: zstack - TI CC2652/CC1352, ember - Silicon Labs (e.g. SLZB-06M)
      pl: zstack - TI CC2652/CC1352, ember - Silicon Labs (np. SLZB-06M)
    type: select
    choices: [zstack, ember, deconz, zigate, zboss]
    default: zstack
    required: true
    when: {option: ZIGBEE2MQTT_COORDINATOR, equals: network}
  - key: ZIGBEE2MQTT_PORT
    label: {en: Web interface port, pl: Port interfejsu WWW}
    help:
      en: HTTPS through the SuplaOS panel, after logging in to the panel.
      pl: HTTPS przez panel SuplaOS, po zalogowaniu do panelu.
    type: port
    default: "8080"
    required: true

ports: ["${ZIGBEE2MQTT_PORT}"]

web:
  port: "${ZIGBEE2MQTT_PORT}"
  proxy: zigbee2mqtt:8080
