id: supla
name: Supla
description:
  en: Your own Supla server - Supla Cloud, supla-server and the database (supla-docker)
  pl: Własny serwer Supla - Supla Cloud, supla-server i baza danych (supla-docker)

# supla-docker files at a fixed commit, updated together with this file.
fetch:
  url: https://github.com/SUPLA/supla-docker/archive/aa63388961cfecda152b1450a0061b80e21c741e.tar.gz
  files: [docker-compose.yml, docker-compose.standalone.yml, .env.default]
files: [.env.default]
env_base: .env.default
# Variables of this add-on for the containers, instead of the whole .env.
env_file: supla.env
compose:
  - docker-compose.yml
  - docker-compose.standalone.yml
  - docker-compose.supla-suplaos.yml
  - file: docker-compose.supla-mqtt.yml
    when: {installed: mosquitto, option: SUPLA_MQTT_BROKER_ENABLED, equals: "true"}
  - file: docker-compose.supla-mqtt-tls.yml
    when: {installed: mosquitto, option: "mosquitto:MOSQUITTO_LAN", in: [tls, both]}
services: [supla-cloud, supla-db, supla-server]
images:
  supla-cloud:
    version_env: CLOUD_VERSION
    changelog: https://github.com/SUPLA/supla-cloud/releases
  supla-server:
    version_env: SERVER_VERSION
    changelog: https://github.com/SUPLA/supla-core/releases
dirs: [ssl/cloud, ssl/server, var]
# The Cloud uses an existing certificate; ssl/server stays the one made by
# supla-server, zigbee2supla trusts exactly that one.
certificates:
  - dir: ssl/cloud
    restart: [supla-cloud]
# supla-server sends state webhooks, e.g. to SUPLA Scripts on this device:
# it trusts the CA of the device too.
trust:
  - dir: ssl/trust
    restart: [supla-server]
data: [ssl/cloud, ssl/server, var/mysql, var/cloud-local, var/cloud-logs]

options:
  - key: SUPLA_HOST_ADDRESS
    label:
      en: Cloud address
      pl: Adres Cloud
    help:
      en: IP address or domain the Cloud is reached at, with the port if it is not 443.
      pl: Adres IP albo domena, pod którą działa Cloud, z portem, jeśli inny niż 443.
    default: "{ip}"
    required: true
  - key: PORT_HTTPS
    label: {en: HTTPS port, pl: Port HTTPS}
    type: port
    default: "443"
    required: true
  - key: MAILER_DSN
    label: {en: E-mail sending, pl: Wysyłanie e-maili}
    help:
      en: "e.g. smtp://user:password@smtp.example.com:587, null://null turns it off"
      pl: "np. smtp://login:hasło@smtp.example.com:587, null://null wyłącza"
    default: null://null
  - key: SUPLA_MAILER_FROM
    label: {en: Sender address, pl: Adres nadawcy}
    help:
      en: The Cloud fails to register accounts with an empty sender, even without e-mail sending.
      pl: Z pustym nadawcą Cloud nie zarejestruje konta, nawet bez wysyłania e-maili.
    type: email
    default: "supla@{hostname}.local"
    required: true
  - key: SUPLA_ACCOUNTS_REGISTRATION_ENABLED
    label: {en: Account registration in the Cloud, pl: Zakładanie kont w Cloud}
    help:
      en: Accounts registered in the Cloud have to be confirmed by e-mail, which needs e-mail sending set up above. Without it create accounts in the SuplaOS panel.
      pl: Konta zakładane w Cloud trzeba potwierdzić e-mailem, co wymaga ustawienia wysyłania e-maili powyżej. Bez tego zakładaj konta w panelu SuplaOS.
    type: select
    choices: ["false", "true"]
    choice_labels:
      "false": {en: "Off", pl: "Wyłączone"}
      "true": {en: "On", pl: "Włączone"}
    default: "false"
    required: true
  - key: SUPLA_MQTT_BROKER_ENABLED
    label: {en: MQTT, pl: MQTT}
    help:
      en: supla-server publishes the channels to the Mosquitto add-on and the Cloud shows MQTT in the account settings. For other devices turn on access from the local network in Mosquitto.
      pl: supla-server publikuje kanały do dodatku Mosquitto, a Cloud pokazuje MQTT w ustawieniach konta. Dla innych urządzeń włącz w Mosquitto dostęp z sieci lokalnej.
    type: select
    choices: ["false", "true"]
    choice_labels:
      "false": {en: "Off", pl: "Wyłączone"}
      "true": {en: "On", pl: "Włączone"}
    default: "false"
    required: true
    when: {installed: mosquitto}
    # Turn MQTT on also in the accounts (the Cloud has a switch per account)
    # and let supla-server read it.
    after:
      - value: "true"
        service: supla-db
        command: [sh, -c, 'exec mariadb --user=supla --password="$MYSQL_PASSWORD" supla -e "update supla_user set mqtt_broker_enabled = 1"']
        restart: [supla-server]
  - key: DATABASE_PASSWORD
    type: secret
    generate: 32
  - key: APP_SECRET
    type: secret
    generate: 64

ports: ["${PORT_HTTPS}", "2015", "2016"]

web:
  scheme: https
  port: "${PORT_HTTPS}"

backup:
  service: supla-db
  command: [sh, -c, 'exec mariadb-dump --routines --user=supla --password="$MYSQL_PASSWORD" supla']
  file: supla-{time}.sql
  # Tables and views are dropped first, so none of a newer Cloud version is
  # left behind. Procedures stay: older dumps were made without them.
  restore:
    - sh
    - -c
    - |
      set -e
      m() { mariadb --user=supla --password="$MYSQL_PASSWORD" supla "$@"; }
      drop=$(m -N -e "select concat('drop ', if(table_type = 'VIEW', 'view', 'table'), ' if exists \`', table_name, '\`;') from information_schema.tables where table_schema = 'supla'")
      { echo 'set foreign_key_checks = 0;'; echo "$drop"; cat; } | m

commands:
  console:
    help:
      en: Supla Cloud console (php bin/console), e.g. supla:user:create
      pl: Konsola Supla Cloud (php bin/console), np. supla:user:create
    service: supla-cloud
    user: www-data
    exec: [php, bin/console]
  sql:
    help:
      en: MariaDB client on the Supla database, e.g. < script.sql or -e "select ..."
      pl: Klient MariaDB na bazie Supli, np. < skrypt.sql albo -e "select ..."
    service: supla-db
    exec: [sh, -c, 'exec mariadb --user=supla --password="$MYSQL_PASSWORD" supla "$@"', sh]
