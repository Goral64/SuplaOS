# SuplaOS changes to supla-docker.
services:
  supla-cloud:
    # .env of SuplaOS holds the variables of all add-ons; supla.env only
    # those of Supla, so installing other add-ons does not recreate it.
    env_file: !override [.env.default, supla.env]
    # HTTPS only, plain HTTP is not published.
    ports: !override
      - "${PORT_HTTPS}:443"
    # supla-server checks the database version on start and gives up when
    # the Cloud has not migrated it yet (first start, updates). The Cloud
    # runs the migrations before Apache starts, so wait until it answers.
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      start_interval: 5s
  supla-db:
    # The database takes its variables from environment in
    # docker-compose.yml, so that changing an option of Supla does not
    # recreate it. Only the time zone comes from here.
    env_file: !reset []
    environment:
      TZ: ${TZ}
  supla-server:
    env_file: !override [.env.default, supla.env]
    # The name in its certificate, for zigbee2supla.
    networks:
      default:
        aliases: [supla-server.local]
    volumes:
      - ./ssl/trust/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # Webhooks may go to <name>.local, e.g. SUPLA Scripts on this device.
    extra_hosts:
      - "${SUPLAOS_HOSTNAME}.local:host-gateway"
    depends_on:
      supla-cloud:
        condition: service_healthy
