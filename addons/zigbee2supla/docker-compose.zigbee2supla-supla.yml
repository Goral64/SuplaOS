# Local Supla server from the supla add-on.
services:
  zigbee2supla:
    environment:
      # The certificate of supla-server is signed by the CA of the device,
      # for this name.
      Z2S_SUPLA_SERVER: supla-server.local
      Z2S_SUPLA_SECURITY_LEVEL: "1"
      Z2S_SUPLA_CA_FILE: /etc/supla-server-ssl/ca.crt
    volumes:
      - ./ssl/server:/etc/supla-server-ssl:ro
    depends_on:
      - supla-server
