id: supla-scripts
name: SUPLA Scripts
description:
  en: Scenes, thermostats, voice commands and notifications for your Supla account (fracz/supla-scripts)
  pl: Sceny, termostaty, polecenia głosowe i powiadomienia dla twojego konta Supla (fracz/supla-scripts)
recommends: [supla]
files: [supla-scripts-start.sh, supla-scripts-apache.conf]
compose:
  - docker-compose.supla-scripts.yml
  - file: docker-compose.supla-scripts-domain.yml
    when: {option: "suplaos:DOMAIN", not_empty: true}
services: [supla-scripts, supla-scripts-db]
images:
  supla-scripts:
    changelog: https://github.com/fracz/supla-scripts/releases
dirs: [ssl/supla-scripts, var/supla-scripts, var/supla-scripts-db]
data: [ssl/supla-scripts, var/supla-scripts, var/supla-scripts-db]
full_backup:
  skip: [var/supla-scripts-db]
certificates:
  - dir: ssl/supla-scripts
    restart: [supla-scripts]

options:
  - key: SUPLA_SCRIPTS_PORT
    label: {en: HTTPS port, pl: Port HTTPS}
    type: port
    default: "8444"
    required: true
  - key: SUPLA_SCRIPTS_URL
    label: {en: Address of SUPLA Scripts, pl: Adres SUPLA Scripts}
    help:
      en: Where SUPLA Scripts is opened, with the port. Supla Cloud sends there the login (OAuth) and changes of the channels.
      pl: Adres, pod którym otwiera się SUPLA Scripts, z portem. Tam Supla Cloud odsyła logowanie (OAuth) i zmiany kanałów.
    default: "https://{ip}:8444"
    required: true
  - key: SUPLA_SCRIPTS_OAUTH_CLOUD
    label: {en: Supla Cloud of the OAuth app, pl: Supla Cloud aplikacji OAuth}
    default: "https://{ip}"
  - key: SUPLA_SCRIPTS_OAUTH_ID
    label: {en: OAuth app ID, pl: Identyfikator aplikacji OAuth}
    help:
      en: "From an app in Supla Cloud (Integrations, My OAuth apps) with the redirect address <address of SUPLA Scripts>/authorize. With Supla on this device Connect with Supla Cloud makes the app instead. Empty: logging in with a personal access token only."
      pl: "Z aplikacji w Supla Cloud (Integracje, Moje aplikacje OAuth) z adresem przekierowania <adres SUPLA Scripts>/authorize. Gdy Supla działa na tym urządzeniu, aplikację zakłada zamiast tego Połącz z Supla Cloud. Puste: logowanie tylko tokenem osobistym."
  - key: SUPLA_SCRIPTS_OAUTH_SECRET
    label: {en: OAuth app secret, pl: Sekret aplikacji OAuth}
    type: password
  - key: SUPLA_SCRIPTS_DB_PASSWORD
    type: secret
    generate: 32
  - key: SUPLA_SCRIPTS_JWT_KEY
    type: secret
    generate: 64

ports: ["${SUPLA_SCRIPTS_PORT}"]

web:
  scheme: https
  port: "${SUPLA_SCRIPTS_PORT}"
  host: scripts
  tls: supla-scripts:443

backup:
  service: supla-scripts-db
  command: [sh, -c, 'exec mariadb-dump --routines --user=suplascripts --password="$MYSQL_PASSWORD" suplascripts']
  file: supla-scripts-{time}.sql
  # As for Supla: tables and views go first, so none of a newer version is
  # left behind.
  restore:
    - sh
    - -c
    - |
      set -e
      m() { mariadb --user=suplascripts --password="$MYSQL_PASSWORD" suplascripts "$@"; }
      drop=$(m -N -e "select concat('drop ', if(table_type = 'VIEW', 'view', 'table'), ' if exists \`', table_name, '\`;') from information_schema.tables where table_schema = 'suplascripts'")
      { echo 'set foreign_key_checks = 0;'; echo "$drop"; cat; } | m

commands:
  console:
    help:
      en: SUPLA Scripts console, e.g. list
      pl: Konsola SUPLA Scripts, np. list
    service: supla-scripts
    user: www-data
    exec: [php, /var/www/supla-scripts]
